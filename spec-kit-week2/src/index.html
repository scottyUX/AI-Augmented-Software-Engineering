<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quote of the Day</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div id="quote-container" class="quote-container">
      <blockquote id="quote-text"></blockquote>
      <p id="quote-author" class="author"></p>
      <div class="actions">
        <button id="favorite-btn" class="icon-btn icon-empty" aria-label="Favorite quote">☆</button>
        <button id="new-quote-btn" class="btn">New Quote</button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
